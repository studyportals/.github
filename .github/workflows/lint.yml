name: Reusable Linting

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: "20"
        type: string
      php-version:
        required: false
        default: "7.4"
        type: string
      validate-php-phpmd:
        required: false
        default: false
        type: boolean
      validate-php-phpstan:
        required: false
        default: false
        type: boolean
    secrets:
      token:
        required: true
jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: files
        uses: studyportals/get-changed-files@main
        with:
          token: ${{ secrets.token }}
          format: csv
          extensions: ".php"
        if: inputs.validate-php-phpmd

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
        if: inputs.validate-php-phpmd

      - run: npm install @studyportals/code-style@$(jq -r '.devDependencies."@studyportals/code-style"' package.json) --no-save --omit=optional
        env:
          CYPRESS_INSTALL_BINARY: 0

      - run: cat .github/super-linter.env >> "$GITHUB_ENV"

      - run: |
          composer config github-oauth.github.com ${{ secrets.token }}

      - uses: super-linter/super-linter/slim@v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.token }}

      - run: |
          composer run phpmd
        if: inputs.validate-php-phpmd

      - run: |
          composer run phpstan
        if: inputs.validate-php-phpstan
