name: Reusable Linting

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: "24"
        type: string
      php-version:
        required: false
        default: "8.5"
        type: string
      validate-php-phpmd:
        required: false
        default: false
        type: boolean
    secrets:
      token:
        required: true
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
        if: inputs.validate-php-phpmd

      - run: npm install @studyportals/code-style@$(jq -r '.devDependencies."@studyportals/code-style"' package.json) --no-save --omit=optional
        env:
          CYPRESS_INSTALL_BINARY: 0

      - run: cat .github/super-linter.env >> "$GITHUB_ENV"

      - run: |
          composer config github-oauth.github.com ${{ secrets.token }}
          npm run configure || true
        if: inputs.validate-php-phpmd

      - uses: super-linter/super-linter/slim@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.token }}

      - run: |
          if [ ! -x "${GITHUB_WORKSPACE}/vendor/bin/phpmd" ]; then
            composer install
          fi
          composer run phpmd
        if: inputs.validate-php-phpmd
